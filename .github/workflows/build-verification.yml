name: Build verification
on:
  push:
    branches: ['dev/mvp-v0.1-task002']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies and generate lockfile
        id: install
        run: npm install --no-audit --no-fund --fetch-retries=1 --fetch-timeout=30000
      - name: Core tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:core
      - name: TypeScript
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx --no-install tsc --noEmit
      - name: Vitest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test -- --reporter=verbose
      - name: Production build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
      - name: Verify generated PWA
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/verify-pwa.mjs
      - name: Export generated lockfile for connector recovery
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          node --input-type=commonjs - <<'NODE'
          const fs = require('node:fs');
          const zlib = require('node:zlib');
          const data = zlib.gzipSync(fs.readFileSync('package-lock.json')).toString('base64');
          for (let i = 0; i < data.length; i += 4000) console.log('LOCKFILE_CHUNK:' + data.slice(i, i + 4000));
          NODE
      - name: Preserve lockfile and build artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-verification
          retention-days: 7
          path: |
            package-lock.json
            dist/
